name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SF_LOGIN_URL: https://test.salesforce.com
          SF_USERNAME: test@test.com
          SF_PASSWORD: testpass
          SF_SECURITY_TOKEN: testtoken
          JWT_CLIENT_SECRET: ci-test-client-secret
          JWT_EMPLOYEE_SECRET: ci-test-employee-secret

  mobile-typecheck:
    name: Mobile Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

  eas-build:
    name: EAS Build (Preview)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: [server-test, mobile-typecheck]
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build preview
        run: eas build --platform all --profile preview --non-interactive
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
